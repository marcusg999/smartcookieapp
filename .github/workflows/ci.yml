name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Dummy, correctly-formatted values so env validation passes in CI. These are
# NOT secrets. Real keys live in Vercel / GitHub environment secrets.
env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_APP_ENV: development
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_dummy
  SUPABASE_SECRET_KEY: sb_secret_ci_dummy
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
  STRIPE_SECRET_KEY: sk_test_ci_dummy
  STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
  RESEND_API_KEY: re_ci_dummy
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  UPSTASH_REDIS_REST_URL: https://example.upstash.io
  UPSTASH_REDIS_REST_TOKEN: ci_dummy
  NEXT_PUBLIC_SENTRY_DSN: https://examplePublicKey@o0.ingest.us.sentry.io/0

jobs:
  checks:
    name: Typecheck, lint, test, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm audit --audit-level=high
      - run: pnpm build
      - name: No secrets in client bundles
        run: |
          # Server-only key prefixes must never appear in browser JS.
          if grep -rEl "sk_(test|live)_|rk_(test|live)_|whsec_|sb_secret_|re_ci_dummy|UPSTASH_REDIS_REST_TOKEN" .next/static; then
            echo "::error::Server secret found in client bundle"; exit 1
          fi
          echo "Client bundles are clean."

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
